/* ---------- datumové pomocné ---------- */
const isoZ = (d) =>
  d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dnesISO = () => isoZ(new Date());
const posun = (d) => { const t = new Date(); t.setDate(t.getDate() + d); return isoZ(t); };

const pridejMesice = (d, n) => {
  const den = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const posledni = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(den, posledni));
};
const dalsiTermin = (iso, typ) => {
  const d = new Date(iso + "T00:00:00");
  if (typ === "tyden") d.setDate(d.getDate() + 7);
  else if (typ === "14dni") d.setDate(d.getDate() + 14);
  else if (typ === "mesic") pridejMesice(d, 1);
  else if (typ === "ctvrtleti") pridejMesice(d, 3);
  else if (typ === "rok") pridejMesice(d, 12);
  else return iso;
  return isoZ(d);
};

const kc = (n) => (n ? new Intl.NumberFormat("cs-CZ").format(n) + " Kč" : "—");
const dnyDo = (iso) => {
  if (!iso) return null;
  return Math.round((new Date(iso + "T00:00:00") - new Date(dnesISO() + "T00:00:00")) / 86400000);
};
const naleha = (d) => (d === null ? "klid" : d < 0 ? "po" : d <= 3 ? "hori" : d <= 10 ? "blizko" : "klid");
const czDatum = (iso) => (iso ? new Date(iso + "T00:00:00").toLocaleDateString("cs-CZ") : "—");
const czKdy = (iso) => { try { return new Date(iso).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch { return iso; } };

const vidiNa = (z, kdo) => {
  if (!jeChraneny(z.modul)) return true;
  if (!z.vidi || z.vidi.length === 0) return true;

};

const lhutyZe = (z) => {

  return out;
};

const odkazUrl = (u) => (/^https?:\/\//i.test(u) ? u : "https://" + u);
const zapis = (e) => (typeof e === "string" ? { t: null, s: e } : e);

const prazdny = (modul, kdoDef) => ({
  id: crypto.randomUUID(),
  modul, nazev: "", odpovedny: kdoDef || LIDE[0], termin: posun(7), pred: 7, stav: "Nové", pozn: "", ukolLidi: [], komentare: [], priorita: "normalni", prilohy: [],
  ...(modul === "nabidky"

    : {}),
  ...(jeChraneny(modul) ? { vidi: [LIDE[0]] } : {}),
});

const normalizujModul = (v) => {
  if (!v) return "ukoly";
  const t = String(v).toLowerCase().trim();
  const m = MODULY.find((x) => x.id === t || x.label.toLowerCase() === t);
  return m ? m.id : "ukoly";
};
const zeZpravy = (text) => {
  const data = JSON.parse(text);
  const pole = Array.isArray(data) ? data : [data];
  return pole.filter((r) => r && r.nazev).map((r) => {
    const modul = normalizujModul(r.modul);
    return {
      ...prazdny(modul), ...r, modul,
      odpovedny: LIDE.includes(r.odpovedny) ? r.odpovedny : LIDE[0],
      stav: STAVY.includes(r.stav) ? r.stav : "Nové",
      termin: r.termin || posun(7),
      pred: Number(r.pred) || 7,
    };
  });
};

/* ---------- export do kalendáře ---------- */
const icsDatum = (iso) => iso.replaceAll("-", "");
const icsPosun = (iso, d) => { const t = new Date(iso + "T00:00:00"); t.setDate(t.getDate() + d); return icsDatum(isoZ(t)); };
const esc = (s) => String(s || "").replace(/[\\;,]/g, (m) => "\\" + m).replace(/\n/g, "\\n");

function textIcs(lhuty) {
  const razitko = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const pad = (n) => String(n).padStart(2, "0");
  const radky = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gecko//CS", "CALSCALE:GREGORIAN"];
  lhuty.forEach((l) => {
    const z = l.z;
    const casPlatny = l.cas && /^\d{1,2}:\d{2}$/.test(l.cas);
    let nazev = l.popis + " – " + l.nadpis;
    if (z.modul === "nabidky") {
      nazev += z.jistotaPozadovana
        ? " · Jistota " + kc(z.jistotaCastka) + (z.jistotaSlozena ? " (složena)" : " (nesložena)")
        : " · Bez jistoty";
    }
    const popis = ["Odpovídá: " + z.odpovedny];
    if (z.rozpoctar) popis.push("Počítá: " + z.rozpoctar);
    if (z.modul === "nabidky") {
      popis.push(z.jistotaPozadovana
        ? "Jistota: " + kc(z.jistotaCastka) + (z.jistotaForma ? ", " + z.jistotaForma : "") + (z.jistotaSlozena ? " – složena" : " – nesložena")
        : "Jistota: ne");
    }
    if (casPlatny) popis.push("Přesný čas podání: " + l.cas);
    if (z.profil) popis.push("Profil zadavatele: " + odkazUrl(z.profil));
    if (z.chybiPolozky && z.chybiPolozky.length) popis.push("Chybí: " + z.chybiPolozky.join(", "));
    radky.push("BEGIN:VEVENT", "UID:" + l.klic + "@gecko", "DTSTAMP:" + razitko);
    if (casPlatny) {
      const [hh, mm] = l.cas.split(":");
      const zac = icsDatum(l.datum) + "T" + pad(hh) + pad(mm) + "00";
      const d = new Date(l.datum + "T" + pad(hh) + ":" + pad(mm) + ":00");
      d.setHours(d.getHours() + 1);
      const kon = icsDatum(isoZ(d)) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
      radky.push("DTSTART:" + zac, "DTEND:" + kon);
    } else {
      radky.push("DTSTART;VALUE=DATE:" + icsDatum(l.datum), "DTEND;VALUE=DATE:" + icsPosun(l.datum, 1));
    }
    radky.push("SUMMARY:" + esc(nazev), "DESCRIPTION:" + esc(popis.join("\n")));
    if (z.profil) radky.push("URL:" + esc(odkazUrl(z.profil)));
    radky.push("BEGIN:VALARM", "TRIGGER:-P" + (l.pred || 7) + "D", "ACTION:DISPLAY", "DESCRIPTION:" + esc(nazev), "END:VALARM", "END:VEVENT");
  });
  radky.push("END:VCALENDAR");
  return radky.join("\r\n");
}
function ulozSoubor(obsah, nazev, mime) {
  const url = URL.createObjectURL(new Blob([obsah], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = nazev; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
}
const stahniIcs = (lhuty, nazev) => ulozSoubor(textIcs(lhuty), nazev, "text/calendar;charset=utf-8");
const stahniZalohu = (zaznamy) => ulozSoubor(JSON.stringify(zaznamy, null, 2), "deska-zaloha-" + dnesISO() + ".json", "application/json");

function Prihlaseni() {
  const [email, setEmail] = useState("");
  const [heslo, setHeslo] = useState("");

  const odesli = async () => {
    setChyba(""); setZprava(""); setCeka(true);
    try {
      if (rezim === "in") {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: heslo });
        if (error) throw error;
      } else {

        if (!data.session) setZprava("Účet je založený. Pokud vám přišel potvrzovací e-mail, potvrďte ho a přihlaste se.");

    } catch (e) {
      setChyba(e.message === "Invalid login credentials" ? "Špatný e-mail nebo heslo." : e.message);
    } finally { setCeka(false); }
  };

  return (
    <div className="deska prihlasovaci">
      <style>{CSS}</style>
      <div className="loginKarta">
        <Logo className="loginLogo" />
        <div className="eyebrow">Oddělení obchodu</div>
        <h1>Géčko</h1>
        <p className="napoveda" style={{ marginTop: 6 }}>
          {rezim === "in" ? "Přihlaste se ke své desce." : "Založte si přístup ke své desce."}
        </p>
        <label className="pole">
          <span>E-mail</span>
          <input type="email" value={email} autoComplete="email"
            onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && odesli()} />
        </label>
        <label className="pole">
          <span>Heslo</span>
          <input type="password" value={heslo} autoComplete={rezim === "in" ? "current-password" : "new-password"}
            onChange={(e) => setHeslo(e.target.value)} onKeyDown={(e) => e.key === "Enter" && odesli()} />
        </label>
        {chyba && <p className="napoveda" style={{ color: "var(--krev)" }}>{chyba}</p>}
        {zprava && <p className="napoveda" style={{ color: "var(--pine)" }}>{zprava}</p>}
        <button className="primar" style={{ width: "100%", padding: "10px", marginTop: 4 }} disabled={ceka || !email || !heslo} onClick={odesli}>
          {ceka ? "Moment…" : rezim === "in" ? "Přihlásit se" : "Založit přístup"}
        </button>
        <button className="prepnoutRezim" onClick={() => { setRezim(rezim === "in" ? "up" : "in"); setChyba(""); setZprava(""); }}>
          {rezim === "in" ? "Nemám ještě přístup — založit" : "Už mám přístup — přihlásit"}
        </button>
      </div>
    </div>
  );
}

function DeskaObchodu({ session }) {
  const ucet = UCTY[session.user.email] || { jmeno: session.user.email, plny: false };
  const kdo = ucet.jmeno;
  const plny = ucet.plny;
  const modulyDostupne = plny ? MODULY : MODULY.filter((m) => !m.chraneny);

  const [edit, setEdit] = useState(null);
  const [rychle, setRychle] = useState(false);
  const [nahled, setNahled] = useState(null);
  const [mizici, setMizici] = useState(() => new Set());
  const dokoncitAnimovane = (klic, akce) => {
    setMizici((s) => new Set(s).add(klic));
    setTimeout(() => {
      akce();
      setMizici((s) => { const n = new Set(s); n.delete(klic); return n; });
    }, 760);
  };

  const nacti = async () => {
    try {
      const d = await nactiZaznamy();
      setZaznamy(d);
      setStavDat("ok");
    } catch (e) {
      console.error(e);
      setStavDat("chyba");
    }
  };

  useEffect(() => {
    nacti();
    const kanal = sb
      .channel("zaznamy-zmeny")
      .on("postgres_changes", { event: "*", schema: "public", table: "zaznamy" }, () => nacti())
      .subscribe();
    return () => { sb.removeChannel(kanal); };
  }, []);

  const uloz = async (z) => {
    try {
      const ulozeny = await ulozZaznam(z);
      setZaznamy((p) => (p.some((x) => x.id === ulozeny.id) ? p.map((x) => (x.id === ulozeny.id ? ulozeny : x)) : [...p, ulozeny]));
      setEdit(null);
    } catch (e) { alert("Uložení se nepodařilo: " + e.message); }
  };
  const smaz = async (id) => {
    try { await smazZaznam(id); setZaznamy((p) => p.filter((x) => x.id !== id)); setEdit(null); }
    catch (e) { alert("Smazání se nepodařilo: " + e.message); }
  };
  const rychleModul = MODULY.some((m) => m.id === pohled) ? pohled : "ukoly";
  const ulozRychle = (nazev) => { uloz({ ...prazdny(rychleModul, kdo), nazev }); setRychle(false); };
  const prepniHotovo = async (z) => {
    const opak = z.opakovani && z.opakovani !== "ne";
    let novy, dokonceno = false;
    if (opak && z.stav !== "Hotovo") {
      let t = dalsiTermin(z.termin, z.opakovani), poj = 0;
      while (dnyDo(t) < 0 && poj++ < 60) t = dalsiTermin(t, z.opakovani);
      novy = { ...z, termin: t, stav: "Nové", splnenoKdy: [...(z.splnenoKdy || []), { t: z.termin, s: dnesISO(), kdo }] };
      dokonceno = true;
    } else if (z.stav === "Hotovo") {
      novy = { ...z, stav: "Probíhá", splneno: null, splnenoKdo: null };
    } else {
      novy = { ...z, stav: "Hotovo", splneno: dnesISO(), splnenoKdo: kdo };
      dokonceno = true;
    }
    try {
      const ulozeny = await ulozZaznam(novy);
      setZaznamy((p) => p.map((x) => (x.id === ulozeny.id ? ulozeny : x)));
    } catch (e) { alert("Změna se nepodařila: " + e.message); }
  };
  const prepniOsobu = async (z, jmeno) => {
    const lidi = (z.ukolLidi || []).map((u) => (u.jmeno === jmeno ? { ...u, hotovo: !u.hotovo } : u));
    let novy = { ...z, ukolLidi: lidi }, dokonceno = false;
    if (lidi.length && lidi.every((u) => u.hotovo)) { novy.stav = "Hotovo"; novy.splneno = dnesISO(); novy.splnenoKdo = kdo; dokonceno = true; }
    else if (novy.stav === "Hotovo") { novy.stav = "Probíhá"; novy.splneno = null; novy.splnenoKdo = null; }
    try {
      const ulozeny = await ulozZaznam(novy);
      setZaznamy((p) => p.map((x) => (x.id === ulozeny.id ? ulozeny : x)));
    } catch (e) { alert("Změna se nepodařila: " + e.message); }
  };

  const ulozKomentar = async (novy) => {
    try {
      const ulozeny = await ulozZaznam(novy);
      setZaznamy((p) => p.map((x) => (x.id === ulozeny.id ? ulozeny : x)));
    } catch (e) { alert("Komentář se nepodařilo uložit: " + e.message); }
  };

  const viditelne = useMemo(() => (plny ? zaznamy : zaznamy.filter((z) => !jeChraneny(z.modul))), [zaznamy, plny]);

  const hlidane = useMemo(() => {
    let l = viditelne.flatMap(lhutyZe);
    if (jenMoje) l = l.filter((x) => x.z.odpovedny === kdo);
    return l.map((x) => ({ ...x, d: dnyDo(x.datum) })).filter((x) => x.d <= x.pred).sort((a, b) => a.d - b.d || prioPoradi(b.z.priorita) - prioPoradi(a.z.priorita));
  }, [viditelne, jenMoje, kdo]);

  const filtrovane = useMemo(() => {
    let v = viditelne;
    if (pohled !== "prehled") v = v.filter((z) => z.modul === pohled);
    if (jenMoje) v = v.filter((z) => z.odpovedny === kdo);
    if (skryHotove) v = v.filter((z) => z.stav !== "Hotovo");
    return [...v].sort((a, b) => (a.termin || "9999").localeCompare(b.termin || "9999") || prioPoradi(b.priorita) - prioPoradi(a.priorita));
  }, [viditelne, pohled, jenMoje, kdo, skryHotove]);

  const splnene = useMemo(() => {
    let v = viditelne;
    if (jenMoje) v = v.filter((z) => z.odpovedny === kdo);
    const out = [];
    v.forEach((z) => {
      if (z.stav === "Hotovo") out.push({ klic: z.id + ":h", z, datum: z.splneno || z.termin, termin: z.termin, kdo: z.splnenoKdo });
      (z.splnenoKdy || []).forEach((e, i) => { const w = zapis(e); out.push({ klic: z.id + ":o" + i, z, datum: w.s, termin: w.t, kdo: w.kdo }); });
    });
    return out.sort((a, b) => (b.datum || "").localeCompare(a.datum || ""));
  }, [viditelne, jenMoje, kdo]);

  const poDobe = hlidane.filter((x) => x.d < 0).length;

  return (
    <div className="deska">
      <style>{CSS}</style>

      <header className="hlava">
        <div className="znackaHlava" onClick={() => window.location.reload()} title="Obnovit stránku" style={{ cursor: "pointer" }}>
          <Logo className="logoMark" />
          <div>
            <div className="eyebrow">Oddělení obchodu</div>
            <h1>Géčko</h1>
          </div>
        </div>
        <div className="hlavaVpravo">
          <div className="zalohy">
            <button className="druhotny" onClick={() => setRychle(true)}>Rychlé zadání</button>
            <button className="druhotny" onClick={() => stahniZalohu(zaznamy)}>Stáhnout zálohu</button>
          </div>
          <div className="kdojsem">
            <span>Přihlášen</span>
            <div className="kdoJmeno">{kdo}{plny && <em className="plnyOznaceni">plný přístup</em>}</div>
          </div>
          <button className="odhlasit" onClick={() => sb.auth.signOut()} title={session.user.email}>Odhlásit</button>
        </div>
      </header>

      <div className="telo">
        {stavDat === "chyba" && (
          <p className="poplach">
            Data se nepodařilo načíst ze serveru. Zkontrolujte připojení k internetu a načtěte stránku znovu. Nic se nepřepsalo.
          </p>
        )}
        <nav className="rail">
          <button className={pohled === "prehled" ? "railBtn on" : "railBtn"} onClick={() => setPohled("prehled")}>
            <span className="railLabel">Hlídač lhůt</span>
            <span className={"railPocet" + (poDobe ? " zvyrazni" : "")}>{hlidane.length}</span>
          </button>
          {modulyDostupne.map((m) => {
            const n = viditelne.filter((z) => z.modul === m.id && z.stav !== "Hotovo").length;
            return (
              <button key={m.id} className={pohled === m.id ? "railBtn on" : "railBtn"} onClick={() => setPohled(m.id)}>
                <span className="railLabel">{m.label}{m.chraneny && <em className="zamek">omezeno</em>}</span>
                <span className="railPocet">{n}</span>
              </button>
            );
          })}
          <button className={pohled === "splnene" ? "railBtn on" : "railBtn"} onClick={() => setPohled("splnene")}>
            <span className="railLabel">Splněné</span>
            <span className="railPocet">{splnene.length}</span>
          </button>
          <button className={pohled === "kalendar" ? "railBtn on" : "railBtn"} onClick={() => setPohled("kalendar")}>
            <span className="railLabel">Kalendář</span>
          </button>
        </nav>

        <main className="obsah">
          {pohled === "prehled" && (
            <div className="panel">
              <div className="panelHlava">
                <h2>Hlídané lhůty</h2>
                <div className="ovladace">
                  <label className="prep">
                    <input type="checkbox" checked={jenMoje} onChange={(e) => setJenMoje(e.target.checked)} /> Jen moje
                  </label>
                  <button className="druhotny" disabled={!hlidane.length} onClick={() => stahniIcs(hlidane, "lhuty-obchod.ics")}>
                    Přidat vše do kalendáře
                  </button>
                  <button className="druhotny" disabled={!hlidane.length}
                    onClick={() => setNahled({ nazev: "lhuty-obchod.ics", obsah: textIcs(hlidane) })}>
                    Nestáhlo se?
                  </button>
                </div>
              </div>
              {stavDat === "nacitam" ? (
                <p className="prazdno">Načítám…</p>
              ) : hlidane.length === 0 ? (
                <p className="prazdno">Žádná lhůta se zatím nepřipomíná. U každého záznamu polem „Připomínat předem" nastavíte, kolik dnů před termínem se tu má objevit.</p>
              ) : (
                <ul className="seznam">
                  {hlidane.map((l) => (<LhutaRadek key={l.klic} l={l} mizi={mizici.has(l.klic)} onEdit={() => setEdit(l.z)} onToggleOsoba={(jmeno) => prepniOsobu(l.z, jmeno)} onHotovo={() => {
                    if (l.klic.endsWith(":jistota")) dokoncitAnimovane(l.klic, () => uloz({ ...l.z, jistotaSlozena: true }));
                    else if (l.z.opakovani && l.z.opakovani !== "ne") prepniHotovo(l.z);
                    else dokoncitAnimovane(l.klic, () => prepniHotovo(l.z));
                  }} />))}
                </ul>
              )}
            </div>
          )}

          {pohled === "splnene" && (
            <div className="panel">
              <div className="panelHlava">
                <h2>Splněné</h2>
                <label className="prep">
                  <input type="checkbox" checked={jenMoje} onChange={(e) => setJenMoje(e.target.checked)} /> Jen moje
                </label>
              </div>
              {splnene.length === 0 ? (
                <p className="prazdno">Zatím nic odškrtnutého. Co odškrtnete tlačítkem „Hotovo" nebo „Splněno", se objeví tady.</p>
              ) : (
                <ul className="seznam">
                  {splnene.map((s) => (
                    <li className="radek" key={s.klic}>
                      <div className="radekText">
                        <button className="nazev" onClick={() => setEdit(s.z)}>{s.z.nazev}</button>
                        <div className="meta">
                          <span className="znacka">{MODULY.find((m) => m.id === s.z.modul)?.label}</span>
                          {s.termin && <span>termín {czDatum(s.termin)}</span>}
                          <span>splněno {czDatum(s.datum)}</span>
                          {s.kdo && <span>splnil {s.kdo}</span>}
                          {s.termin && s.datum > s.termin && <span className="omezeno">po termínu</span>}
                          <span>odpovídá {s.z.odpovedny}</span>
                        </div>
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          )}

          {pohled === "kalendar" && <Kalendar zaznamy={viditelne} onEdit={setEdit} />}

          {pohled !== "prehled" && pohled !== "splnene" && pohled !== "kalendar" && (
            <div className="panel">
              <div className="panelHlava">
                <h2>{MODULY.find((m) => m.id === pohled).label}</h2>
                <div className="ovladace">
                  <label className="prep">
                    <input type="checkbox" checked={jenMoje} onChange={(e) => setJenMoje(e.target.checked)} /> Jen moje
                  </label>
                  <label className="prep">
                    <input type="checkbox" checked={skryHotove} onChange={(e) => setSkryHotove(e.target.checked)} /> Skrýt hotové
                  </label>
                  <button className="primar" onClick={() => setEdit(prazdny(pohled, kdo))}>Přidat záznam</button>
                </div>
              </div>
              {filtrovane.length === 0 ? (
                <p className="prazdno">Tady zatím nic není. Přidejte první záznam a přiřaďte k němu termín a odpovědnou osobu.</p>
              ) : (
                <ul className="seznam">
                  {filtrovane.map((z) => (<Radek key={z.id} z={z} mizi={mizici.has(z.id)} onEdit={() => setEdit(z)} onToggleOsoba={(jmeno) => prepniOsobu(z, jmeno)} onHotovo={() => {
                    if (z.stav === "Hotovo") prepniHotovo(z);
                    else if (z.opakovani && z.opakovani !== "ne") prepniHotovo(z);
                    else dokoncitAnimovane(z.id, () => prepniHotovo(z));
                  }} />))}
                </ul>
              )}
            </div>
          )}
        </main>
      </div>

      {edit && <Formular zaznam={edit} ja={kdo} onUloz={uloz} onSmaz={smaz} onKomentar={ulozKomentar} onZavri={() => setEdit(null)} />}
      {nahled && <NahledSouboru nazev={nahled.nazev} obsah={nahled.obsah} onZavri={() => setNahled(null)} />}
      {rychle && <RychleZadani modul={rychleModul} onUloz={ulozRychle} onZavri={() => setRychle(false)} />}
    </div>
  );
}

/* ---------- části ---------- */
function Odpocet({ d, hotovo }) {
  const n = hotovo ? "klid" : naleha(d);
  return (
    <div className={"lhuta n-" + n}>
      <span className="lhutaCislo">{hotovo ? "—" : d === null ? "—" : Math.abs(d)}</span>
      <span className="lhutaJed">{hotovo ? "hotovo" : d === null ? "bez lhůty" : d < 0 ? "dnů po" : d === 0 ? "dnes" : "dnů"}</span>
    </div>
  );
}
function PrioZnacka({ p }) {
  if (!p || p === "normalni") return null;
  const info = PRIORITY.find((x) => x.id === p);
  return <span className={"prioBadge " + p}>{info ? info.label : p}</span>;
}
const prioTrida = (p) => (p && p !== "normalni" ? " prio-" + p : "");

function DetailZaznamu({ z, onToggleOsoba, modulLabel }) {
  const hotovo = z.stav === "Hotovo";
  const jistotaVisi = z.modul === "nabidky" && z.jistotaPozadovana && !z.jistotaSlozena && !hotovo;
  return (
    <React.Fragment>
      <div className="meta">
        {modulLabel && <span className="znacka">{modulLabel}</span>}
        <span>{z.odpovedny}</span>
        <span>{z.stav}</span>
        <span>{czDatum(z.termin)}</span>
        {z.profil && (<a className="odkaz" href={odkazUrl(z.profil)} target="_blank" rel="noopener noreferrer">Profil zadavatele</a>)}
        {z.rozpoctar && <span>počítá {z.rozpoctar}</span>}
        {z.opakovani && z.opakovani !== "ne" && (<span>{OPAKOVANI.find((o) => o.id === z.opakovani)?.label.toLowerCase()}</span>)}
        {z.splnenoKdy?.length > 0 && (<span>splněno {z.splnenoKdy.length}×, naposledy {czDatum(zapis(z.splnenoKdy[z.splnenoKdy.length - 1]).s)}</span>)}
        {z.splneno && <span>splněno {czDatum(z.splneno)}</span>}
        {z.komentare?.length > 0 && <span>{z.komentare.length}× koment.</span>}
        {z.prilohy?.length > 0 && <span>{z.prilohy.length} příl.</span>}
      </div>
      {z.modul === "nabidky" && z.termin && (
        <div className="podani">Podání nabídky: {czDatum(z.termin)}{z.lhutaCas ? " v " + z.lhutaCas : ""}</div>
      )}
      {jistotaVisi && <div className="varovani">Jistota {kc(z.jistotaCastka)} · nesložena</div>}
      {z.chybiPolozky?.length > 0 && <div className="chybi">Chybí: {z.chybiPolozky.join(" · ")}</div>}
      {z.ukolLidi?.length > 0 && (
        <div className="ukolLide">
          <span className="ukolLidePocet">{z.ukolLidi.filter((u) => u.hotovo).length}/{z.ukolLidi.length} splněno</span>
          {z.ukolLidi.map((u) => (
            <button key={u.jmeno} className={u.hotovo ? "osobaChip hot" : "osobaChip"} onClick={() => onToggleOsoba && onToggleOsoba(u.jmeno)}>
              {u.hotovo ? "✓ " : ""}{u.jmeno}
            </button>
          ))}
        </div>
      )}
    </React.Fragment>
  );
}
function SplnenoBadge() {
  return (
    <span className="splnenoBadge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle className="kr" cx="12" cy="12" r="11" /><path className="th" d="M6.8 12.6l3.2 3.2L17.2 8.8" /></svg>
      Splněno
    </span>
  );
}
function LhutaRadek({ l, onEdit, onToggleOsoba, onHotovo, mizi }) {
  const jeJistota = l.klic.endsWith(":jistota");
  return (
    <li className={"radek" + prioTrida(l.z.priorita) + (mizi ? " mizi" : "")}>
      <Odpocet d={l.d} />
      <div className="radekText">
        <button className="nazev" onClick={onEdit}>{l.nadpis}</button><PrioZnacka p={l.z.priorita} />
        <div className="popisLhuty">{l.popis} · {czDatum(l.datum)}{l.cas ? " v " + l.cas : ""}</div>
        <DetailZaznamu z={l.z} onToggleOsoba={onToggleOsoba} modulLabel={MODULY.find((m) => m.id === l.z.modul)?.label} />
      </div>
      {mizi ? <SplnenoBadge /> : (
        <div className="radekAkce">
          <button className="hotovoBtn" onClick={onHotovo}>{jeJistota ? "Jistota složena" : (l.z.opakovani && l.z.opakovani !== "ne" ? "Splněno" : "Hotovo")}</button>
          <button className="odskrtnout" onClick={() => stahniIcs([l], "lhuta.ics")}>Do kalendáře</button>
        </div>
      )}
    </li>
  );
}
function Radek({ z, onEdit, onHotovo, onToggleOsoba, mizi }) {
  const d = dnyDo(z.termin);
  const hotovo = z.stav === "Hotovo";
  return (
    <li className={"radek" + (hotovo ? " hotovo" : "") + prioTrida(z.priorita) + (mizi ? " mizi" : "")}>
      <Odpocet d={d} hotovo={hotovo} />
      <div className="radekText">
        <button className="nazev" onClick={onEdit}>{z.nazev || "(bez názvu)"}</button><PrioZnacka p={z.priorita} />
        <DetailZaznamu z={z} onToggleOsoba={onToggleOsoba} />
      </div>
      {mizi ? <SplnenoBadge /> : (
        <button className="odskrtnout" onClick={onHotovo}>
          {z.opakovani && z.opakovani !== "ne" ? "Splněno" : hotovo ? "Vrátit" : "Hotovo"}
        </button>
      )}
    </li>
  );
}
function NahledSouboru({ nazev, obsah, onZavri }) {
  const [zkopirovano, setZkopirovano] = useState(false);
  return (
    <div className="zaves" onClick={onZavri}>
      <div className="okno" onClick={(e) => e.stopPropagation()}>
        <div className="oknoHlava">
          <span className="eyebrow">{nazev}</span>
          <button className="zavri" onClick={onZavri}>Zavřít</button>
        </div>
        <p className="napoveda" style={{ margin: "0 0 10px" }}>
          Zkopírujte text, vložte do poznámkového bloku a uložte pod názvem {nazev}. Po otevření souboru si událost založí kalendář sám.
        </p>
        <textarea rows="10" readOnly value={obsah} onFocus={(e) => e.target.select()} style={{ width: "100%" }} />
        <div className="oknoPata">
          <span />
          <button className="primar" onClick={() => { navigator.clipboard?.writeText(obsah).then(() => setZkopirovano(true), () => setZkopirovano(false)); }}>
            {zkopirovano ? "Zkopírováno" : "Zkopírovat text"}
          </button>
        </div>
      </div>
    </div>
  );
}
function RychleZadani({ modul, onUloz, onZavri }) {
  const [nazev, setNazev] = useState("");
  const modulLabel = MODULY.find((m) => m.id === modul)?.label || "Úkoly";
  const vloz = () => {
    const t = nazev.trim();
    if (!t) return;
    onUloz(t);
  };
  return (
    <div className="zaves" onClick={onZavri}>
      <div className="okno" onClick={(e) => e.stopPropagation()}>
        <div className="oknoHlava">
          <span className="eyebrow">Rychlé zadání</span>
          <button className="zavri" onClick={onZavri}>Zavřít</button>
        </div>
        <label className="pole">
          <span>Název úkolu — můžete nadiktovat mikrofonem na klávesnici telefonu</span>
          <textarea rows="3" autoFocus value={nazev}
            onChange={(e) => setNazev(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); vloz(); } }} />
        </label>
        <p className="napoveda">Přidá se do „{modulLabel}", odpovídá vám, termín za týden. Podrobnosti (kdo, přesný termín, priorita) doladíte kdykoli později v úpravě záznamu.</p>
        <div className="oknoPata">
          <span />
          <button className="primar" onClick={vloz}>Přidat</button>
        </div>
      </div>
    </div>
  );
}
function Formular({ zaznam, ja, onUloz, onSmaz, onKomentar, onZavri }) {
  const [z, setZ] = useState(zaznam);
  const [novyKom, setNovyKom] = useState("");
  const zmen = (k, v) => setZ((p) => ({ ...p, [k]: v }));
  const pridatKomentar = () => {
    const t = novyKom.trim();
    if (!t) return;
    const komentare = [...(z.komentare || []), { text: t, kdo: ja, kdy: new Date().toISOString() }];
    const novy = { ...z, komentare };
    setZ(novy);
    onKomentar(novy);
    setNovyKom("");
  };
  const [nahravam, setNahravam] = useState(false);
  const pridatPrilohu = async (file) => {
    if (!file) return;
    if (file.size > 26214400) { alert("Soubor je větší než 25 MB. Nahrajte menší."); return; }
    setNahravam(true);
    try {
      const cesta = await nahrajPrilohu(z.id, file);
      const prilohy = [...(z.prilohy || []), { name: file.name, path: cesta, kdo: ja, kdy: new Date().toISOString() }];
      const novy = { ...z, prilohy };
      setZ(novy);
      onKomentar(novy);
    } catch (e) { alert("Nahrání se nepodařilo: " + e.message); }
    finally { setNahravam(false); }
  };
  const otevriPrilohu = async (p) => {
    try { const url = await odkazPrilohy(p.path); window.open(url, "_blank", "noopener"); }
    catch (e) { alert("Soubor se nepodařilo otevřít: " + e.message); }
  };
  const odeberPrilohu = async (p) => {
    try {
      await smazPrilohu(p.path);
      const novy = { ...z, prilohy: (z.prilohy || []).filter((x) => x.path !== p.path) };
      setZ(novy);
      onKomentar(novy);
    } catch (e) { alert("Odebrání se nepodařilo: " + e.message); }
  };
  const prepniVidi = (osoba) =>
    setZ((p) => { const v = p.vidi || []; return { ...p, vidi: v.includes(osoba) ? v.filter((x) => x !== osoba) : [...v, osoba] }; });
  const prepniUkolLidi = (osoba) =>
    setZ((p) => {
      const lidi = p.ukolLidi || [];
      return { ...p, ukolLidi: lidi.some((u) => u.jmeno === osoba) ? lidi.filter((u) => u.jmeno !== osoba) : [...lidi, { jmeno: osoba, hotovo: false }] };
    });
  const [novaPolozka, setNovaPolozka] = useState("");
  const pridejPolozku = () => {
    const t = novaPolozka.trim();
    if (!t) return;
    setZ((p) => ({ ...p, chybiPolozky: [...(p.chybiPolozky || []), t] }));
    setNovaPolozka("");
  };
  const odeberPolozku = (i) => setZ((p) => ({ ...p, chybiPolozky: (p.chybiPolozky || []).filter((_, j) => j !== i) }));
  return (
    <div className="zaves" onClick={onZavri}>
      <div className="okno" onClick={(e) => e.stopPropagation()}>
        <div className="oknoHlava">
          <span className="eyebrow">{MODULY.find((m) => m.id === z.modul)?.label}</span>
          <button className="zavri" onClick={onZavri}>Zavřít</button>
        </div>
        <label className="pole">
          <span>Název</span>
          <input value={z.nazev} onChange={(e) => zmen("nazev", e.target.value)} placeholder="Název zakázky nebo úkolu" autoFocus />
        </label>
        <div className="dvojice">
          <label className="pole">
            <span>Odpovídá</span>
            <select value={z.odpovedny} onChange={(e) => zmen("odpovedny", e.target.value)}>
              {!LIDE.includes(z.odpovedny) && z.odpovedny && <option>{z.odpovedny}</option>}
              {LIDE.map((l) => (<option key={l}>{l}</option>))}
            </select>
          </label>
          <label className="pole">
            <span>Stav</span>
            <select value={z.stav} onChange={(e) => zmen("stav", e.target.value)}>
              {STAVY.map((s) => (<option key={s}>{s}</option>))}
            </select>
          </label>
        </div>
        <label className="pole">
          <span>Priorita</span>
          <select value={z.priorita || "normalni"} onChange={(e) => zmen("priorita", e.target.value)}>
            {PRIORITY.map((p) => (<option key={p.id} value={p.id}>{p.label}</option>))}
          </select>
        </label>

        <div className="dvojice">
          <label className="pole">
            <span>{MODULY.find((m) => m.id === z.modul)?.terminPopis}</span>
            <input type="date" value={z.termin || ""} onChange={(e) => zmen("termin", e.target.value)} />
          </label>
          <label className="pole">
            <span>Připomínat předem</span>
            <select value={z.pred ?? 7} onChange={(e) => zmen("pred", Number(e.target.value))}>
              {[1, 2, 3, 5, 7, 10, 14, 21, 30].map((n) => (<option key={n} value={n}>{n} dnů předem</option>))}
            </select>
          </label>
        </div>
        <label className="pole">
          <span>Opakování</span>
          <select value={z.opakovani || "ne"} onChange={(e) => zmen("opakovani", e.target.value)}>
            {OPAKOVANI.map((o) => (<option key={o.id} value={o.id}>{o.label}</option>))}
          </select>
        </label>

        <div className="pole">
          <span>Úkol pro více lidí (nepovinné)</span>
          <div className="vidiVolby">
            {LIDE.map((l) => {
              const on = (z.ukolLidi || []).some((u) => u.jmeno === l);
              return (<button key={l} type="button" className={on ? "chip on" : "chip"} onClick={() => prepniUkolLidi(l)}>{l}</button>);
            })}
          </div>
          <p className="napoveda">Vyberte víc lidí, když stejný úkol dělá několik kolegů. U úkolu se pak odškrtává, kdo už svou část splnil, a vy vidíte, kolik z nich je hotovo.</p>
        </div>

        {z.modul === "nabidky" && (
          <div className="blok">
            <label className="pole">
              <span>Přesný čas podání (dle profilu zadavatele)</span>
              <input type="time" value={z.lhutaCas || ""} onChange={(e) => zmen("lhutaCas", e.target.value)} />
            </label>
            <label className="pole">
              <span>Profil zadavatele</span>
              <input value={z.profil || ""} onChange={(e) => zmen("profil", e.target.value)} placeholder="Odkaz na zakázku" />
            </label>
            <label className="pole">
              <span>Rozpočtář</span>
              <input value={z.rozpoctar || ""} onChange={(e) => zmen("rozpoctar", e.target.value)} placeholder="Kdo nabídku počítá" list="lide-seznam" />
              <datalist id="lide-seznam">{LIDE.map((l) => (<option key={l} value={l} />))}</datalist>
            </label>
            <label className="prep silny">
              <input type="checkbox" checked={!!z.jistotaPozadovana} onChange={(e) => zmen("jistotaPozadovana", e.target.checked)} />
              Zadavatel požaduje jistotu (§ 41 ZZVZ)
            </label>
            {z.jistotaPozadovana && (
              <>
                <div className="dvojice">
                  <label className="pole">
                    <span>Výše jistoty</span>
                    <input type="number" min="0" step="1000" value={z.jistotaCastka || 0} onChange={(e) => zmen("jistotaCastka", Number(e.target.value))} />
                  </label>
                  <label className="pole">
                    <span>Forma</span>
                    <select value={z.jistotaForma || FORMY_JISTOTY[0]} onChange={(e) => zmen("jistotaForma", e.target.value)}>
                      {FORMY_JISTOTY.map((f) => (<option key={f}>{f}</option>))}
                    </select>
                  </label>
                </div>
                <div className="dvojice">
                  <label className="pole">
                    <span>Složit do</span>
                    <input type="date" value={z.jistotaTermin || ""} onChange={(e) => zmen("jistotaTermin", e.target.value)} />
                  </label>
                  <label className="pole pole-check">
                    <span>Stav jistoty</span>
                    <label className="prep">
                      <input type="checkbox" checked={!!z.jistotaSlozena} onChange={(e) => zmen("jistotaSlozena", e.target.checked)} /> Složena
                    </label>
                  </label>
                </div>
              </>
            )}
            <div className="pole">
              <span>Co ještě chybí</span>
              {(z.chybiPolozky || []).length > 0 && (
                <ul className="polozky">
                  {z.chybiPolozky.map((p, i) => (
                    <li key={i}><span>{p}</span><button type="button" className="odebrat" onClick={() => odeberPolozku(i)}>×</button></li>
                  ))}
                </ul>
              )}
              <div className="pridatPolozku">
                <input value={novaPolozka} onChange={(e) => setNovaPolozka(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); pridejPolozku(); } }}
                  placeholder="Např. ceny kamene" />
                <button type="button" className="druhotny" onClick={pridejPolozku}>Přidat</button>
              </div>
            </div>
          </div>
        )}
        {jeChraneny(z.modul) && (
          <p className="napoveda" style={{ marginBottom: 12 }}>Tento modul (Majetek / ETERN) vidí jen lidé s plným přístupem — Vít a Miloš.</p>
        )}
        <div className="prilohyBlok">
          <span className="komentareNadpis">Přílohy</span>
          {(z.prilohy || []).length > 0 && (
            <ul className="prilohy">
              {z.prilohy.map((p, i) => (
                <li key={i}>
                  <button type="button" className="prilohaOdkaz" onClick={() => otevriPrilohu(p)}>{p.name}</button>
                  <span className="prilohaMeta">{p.kdo || "?"} · {czKdy(p.kdy)}</span>
                  <button type="button" className="odebrat" onClick={() => odeberPrilohu(p)}>×</button>
                </li>
              ))}
            </ul>
          )}
          <label className="nahratBtn">
            {nahravam ? "Nahrávám…" : "Nahrát soubor"}
            <input type="file" style={{ display: "none" }} disabled={nahravam}
              onChange={(e) => { const f = e.target.files?.[0]; if (f) pridatPrilohu(f); e.target.value = ""; }} />
          </label>
          <p className="napoveda">PDF a obrázky se otevřou rovnou, Word/Excel se stáhnou. Max 25 MB na soubor.</p>
        </div>

        <div className="komentareBlok">
          <span className="komentareNadpis">Komentáře</span>
          {(z.komentare || []).length === 0 ? (
            <p className="napoveda" style={{ margin: "4px 0 8px" }}>Zatím žádný komentář. Co sem napíšete, se uloží hned a zůstane — i s tím, kdo a kdy to napsal.</p>
          ) : (
            <ul className="komentare">
              {z.komentare.map((k, i) => (
                <li key={i}>
                  <div className="komMeta">{k.kdo || "?"} · {czKdy(k.kdy)}</div>
                  <div className="komText">{k.text}</div>
                </li>
              ))}
            </ul>
          )}
          <div className="pridatKom">
            <textarea rows="2" value={novyKom} onChange={(e) => setNovyKom(e.target.value)} placeholder="Napište komentář…"
              onKeyDown={(e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pridatKomentar(); } }} />
            <button type="button" className="primar" onClick={pridatKomentar}>Přidat</button>
          </div>
        </div>
        <div className="oknoPata">
          <span className="napoveda" style={{ margin: 0, maxWidth: "55%" }}>Záznamy se nemažou. Hotové dáte tlačítkem „Hotovo" do Splněných, kde zůstanou i s tím, kdo je splnil.</span>
          <button className="primar" onClick={() => onUloz(z)}>Uložit záznam</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- kalendář ---------- */
function Kalendar({ zaznamy, onEdit }) {
  const dnesD = new Date();
  const [rok, setRok] = useState(dnesD.getFullYear());
  const [mesic, setMesic] = useState(dnesD.getMonth());
  const nazvyMesicu = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
  const dnyTydne = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
  const udalosti = useMemo(() => {
    const m = {};
    zaznamy.forEach((z) => lhutyZe(z).forEach((l) => { (m[l.datum] = m[l.datum] || []).push({ z, jistota: l.klic.endsWith(":jistota") }); }));
    return m;
  }, [zaznamy]);
  const startDen = (new Date(rok, mesic, 1).getDay() + 6) % 7;
  const pocetDni = new Date(rok, mesic + 1, 0).getDate();
  const bunky = [];
  for (let i = 0; i < startDen; i++) bunky.push(null);
  for (let d = 1; d <= pocetDni; d++) bunky.push(d);
  while (bunky.length % 7) bunky.push(null);
  const posun = (delta) => { let mm = mesic + delta, rr = rok; if (mm < 0) { mm = 11; rr--; } else if (mm > 11) { mm = 0; rr++; } setMesic(mm); setRok(rr); };
  const naDnes = () => { setRok(dnesD.getFullYear()); setMesic(dnesD.getMonth()); };
  const dnesIso = isoZ(dnesD);
  return (
    <div className="panel">
      <div className="panelHlava">
        <h2>{nazvyMesicu[mesic]} {rok}</h2>
        <div className="ovladace">
          <button className="druhotny" onClick={() => posun(-1)}>‹ Předchozí</button>
          <button className="druhotny" onClick={naDnes}>Dnes</button>
          <button className="druhotny" onClick={() => posun(1)}>Další ›</button>
        </div>
      </div>
      <div className="kalWrap">
        <div className="kalMrizka">
          {dnyTydne.map((d) => (<div key={d} className="kalHlavicka">{d}</div>))}
          {bunky.map((den, i) => {
            if (den === null) return <div key={i} className="kalBunka prazdna" />;
            const iso = rok + "-" + String(mesic + 1).padStart(2, "0") + "-" + String(den).padStart(2, "0");
            const ev = udalosti[iso] || [];
            return (
              <div key={i} className={"kalBunka" + (iso === dnesIso ? " dnes" : "")}>
                <div className="kalDen">{den}</div>
                {ev.slice(0, 4).map((e, j) => (
                  <button key={j} className={"kalUdalost" + prioTrida(e.z.priorita)} onClick={() => onEdit(e.z)} title={e.z.nazev}>
                    {e.jistota ? "Jistota: " : ""}{e.z.nazev}
                  </button>
                ))}
                {ev.length > 4 && <div className="kalVic">+{ev.length - 4} dalších</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- kořen ---------- */
function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="nacitani">Načítám…</div>;
  if (!session) return <Prihlaseni />;
  return <DeskaObchodu session={session} />;
}

.obsah{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--karta);border:1px solid var(--linka);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.panelHlava{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--linka2);flex-wrap:wrap}
.ovladace{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prep{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer}
.prep.silny{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:10px}
.primar{font:inherit;font-size:13px;font-weight:600;padding:8px 15px;border:0;border-radius:8px;background:var(--zelena);color:#fff;cursor:pointer}
.primar:hover{background:var(--zelena-tmava)}
.primar:disabled{opacity:.5;cursor:default}
.druhotny{font:inherit;font-size:12px;font-weight:500;padding:7px 12px;border:1px solid var(--linka);border-radius:8px;background:var(--karta);color:var(--ink);cursor:pointer}
.druhotny:hover{background:#f9fafb;border-color:#d1d5db}
.druhotny:disabled{opacity:.4;cursor:default}

.seznam{list-style:none;margin:0;padding:0}
.radek{display:flex;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--linka2)}
.radek:last-child{border-bottom:0}
.radek:hover{background:#fafbfc}
.radek.hotovo{opacity:.5}
.radek.prio-vysoka{box-shadow:inset 4px 0 0 var(--jantar)}
.radek.prio-kriticka{box-shadow:inset 4px 0 0 var(--krev)}
.lhuta{flex:0 0 52px;text-align:center}
.lhutaCislo{display:block;font-size:22px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.lhutaJed{display:block;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.n-po .lhutaCislo{color:var(--krev)}
.n-po .lhutaJed{color:var(--krev)}
.n-hori .lhutaCislo{color:var(--jantar-tmava)}
.radekText{flex:1;min-width:0}
.nazev{font:inherit;font-size:15px;font-weight:600;background:0;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:left}
.nazev:hover{color:var(--zelena-tmava)}
.popisLhuty{font-size:13px;color:var(--ink2);margin-top:2px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink2);align-items:center}
.znacka{font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);background:var(--linka2);padding:2px 7px;border-radius:6px}
.omezeno{color:var(--krev);font-weight:500}
.odkaz{color:var(--zelena-tmava);font-weight:500;text-decoration:none}
.odkaz:hover{text-decoration:underline}
.varovani{margin-top:6px;font-size:12.5px;color:var(--krev);font-weight:500}
.chybi{margin-top:6px;font-size:12.5px;color:var(--jantar-tmava)}
.podani{margin-top:6px;font-size:12.5px;color:var(--zelena-tmava);font-weight:600}
.prioBadge{font-size:10px;font-weight:600;letter-spacing:.02em;padding:2px 9px;margin-left:8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.prioBadge.vysoka{background:var(--jantar-svetla);color:var(--jantar-tmava)}
.prioBadge.kriticka{background:var(--krev-svetla);color:#b91c1c}
.odskrtnout{font:inherit;font-size:12px;font-weight:500;padding:6px 12px;background:var(--karta);border:1px solid var(--linka);border-radius:8px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.odskrtnout:hover{border-color:var(--zelena);color:var(--zelena-tmava)}
.radekAkce{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.hotovoBtn{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;background:var(--zelena);border:1px solid var(--zelena);border-radius:8px;cursor:pointer;color:#fff;white-space:nowrap}
.hotovoBtn:hover{background:var(--zelena-tmava);border-color:var(--zelena-tmava)}
.radek.mizi{animation:radekMizi .74s ease forwards;overflow:hidden;pointer-events:none}
@keyframes radekMizi{0%{background:transparent;max-height:320px}18%{background:rgba(0,176,80,.13)}52%{background:rgba(0,176,80,.13);max-height:320px;opacity:1}100%{background:rgba(0,176,80,.04);max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-width:0}}
.splnenoBadge{display:flex;align-items:center;gap:7px;color:var(--zelena-tmava);font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.splnenoBadge svg{width:22px;height:22px;animation:splnenoPop .34s cubic-bezier(.2,1.4,.4,1) both}
.splnenoBadge .kr{fill:var(--zelena)}
.splnenoBadge .th{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:splnenoTah .4s ease-out .1s forwards}
@keyframes splnenoPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splnenoTah{to{stroke-dashoffset:0}}
.prazdno{padding:24px 16px;color:var(--ink2);font-size:14px;margin:0;line-height:1.5}
.kalWrap{overflow-x:auto;padding:12px 14px}
.kalMrizka{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:660px}
.kalHlavicka{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);text-align:center;padding:2px 0}
.kalBunka{min-height:94px;border:1px solid var(--linka2);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;background:#fff;overflow:hidden}
.kalBunka.prazdna{background:transparent;border:0}
.kalBunka.dnes{border-color:var(--zelena);box-shadow:inset 0 0 0 1px var(--zelena)}
.kalDen{font-size:12px;font-weight:600;color:var(--ink2)}
.kalBunka.dnes .kalDen{color:var(--zelena-tmava)}
.kalUdalost{font:inherit;font-size:11px;line-height:1.25;text-align:left;background:var(--linka2);border:0;border-left:3px solid var(--ink2);border-radius:4px;padding:3px 5px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kalUdalost:hover{background:#e9ecef}
.kalUdalost.prio-vysoka{border-left-color:var(--jantar)}
.kalUdalost.prio-kriticka{border-left-color:var(--krev)}
.kalVic{font-size:10px;color:var(--ink2);padding-left:3px}

.ukolLide{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ukolLidePocet{font-size:11px;font-weight:600;color:var(--ink2);margin-right:2px}
.osobaChip{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--linka);background:var(--karta);color:var(--ink2);cursor:pointer;border-radius:999px}
.osobaChip:hover{border-color:#d1d5db}
.osobaChip.hot{background:var(--zelena-svetla);border-color:var(--zelena);color:var(--zelena-tmava);font-weight:600}

.zaves{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
.okno{background:var(--karta);border-radius:14px;width:100%;max-width:540px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.oknoHlava{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.zavri{font:inherit;font-size:13px;background:0;border:0;cursor:pointer;color:var(--ink2)}
.zavri:hover{color:var(--ink)}
.pole{display:block;margin-bottom:14px}
.pole>span{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.pole input,.pole select,.pole textarea{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--linka);border-radius:8px;background:var(--karta);color:var(--ink)}
.pole input:focus,.pole select:focus,.pole textarea:focus{outline:none;border-color:var(--zelena);box-shadow:0 0 0 3px var(--zelena-svetla)}
.pole-check .prep{padding:8px 0}
.pole-check input{width:auto}
.blok{border:1px solid var(--linka);border-left:3px solid var(--zelena);border-radius:8px;padding:14px 14px 2px;margin-bottom:14px;background:#fbfdfa}
.dvojice{display:flex;gap:12px}
.dvojice .pole{flex:1}
.vidiVolby{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--linka);border-radius:999px;background:var(--karta);cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--zelena);color:#fff;border-color:var(--zelena)}
.napoveda{font-size:12px;color:var(--ink2);margin:7px 0 0;line-height:1.45}
.oknoPata{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.smazat{font:inherit;font-size:12px;background:0;border:0;color:var(--krev);cursor:pointer}

.polozky{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:5px}
.polozky li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f9fafb;border:1px solid var(--linka);border-radius:8px;padding:6px 10px;font-size:13px}
.polozky .odebrat{font:inherit;font-size:16px;line-height:1;background:0;border:0;color:var(--ink2);cursor:pointer;padding:0 2px}
.polozky .odebrat:hover{color:var(--krev)}
.pridatPolozku{display:flex;gap:8px}
.pridatPolozku input{flex:1;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--linka);border-radius:8px;background:var(--karta);color:var(--ink)}

.komentareBlok,.prilohyBlok{margin-bottom:14px;border-top:1px solid var(--linka2);padding-top:14px}
.komentareNadpis{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.komentare{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.komentare li{background:#f9fafb;border:1px solid var(--linka);border-radius:8px;padding:8px 10px}
.komMeta{font-size:11px;color:var(--ink2);margin-bottom:3px;font-weight:500}
.komText{font-size:13px;line-height:1.45;white-space:pre-wrap}
.pridatKom{display:flex;gap:8px;align-items:flex-end}
.pridatKom textarea{flex:1;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--linka);border-radius:8px;background:var(--karta);color:var(--ink);resize:vertical}

.prilohy{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:5px}
.prilohy li{display:flex;align-items:center;gap:8px;background:#f9fafb;border:1px solid var(--linka);border-radius:8px;padding:7px 10px}
.prilohaOdkaz{font:inherit;font-size:13px;background:0;border:0;padding:0;color:var(--zelena-tmava);font-weight:500;text-decoration:none;cursor:pointer;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prilohaOdkaz:hover{text-decoration:underline}
.prilohaMeta{font-size:11px;color:var(--ink2);white-space:nowrap}
.prilohy .odebrat{font:inherit;font-size:16px;line-height:1;background:0;border:0;color:var(--ink2);cursor:pointer;padding:0 2px}
.prilohy .odebrat:hover{color:var(--krev)}
.nahratBtn{display:inline-block;font:inherit;font-size:12px;font-weight:500;padding:7px 12px;border:1px solid var(--linka);border-radius:8px;background:var(--karta);color:var(--ink);cursor:pointer}
.nahratBtn:hover{border-color:var(--zelena);color:var(--zelena-tmava)}

.deska :focus-visible{outline:2px solid var(--zelena);outline-offset:2px}

.prihlasovaci{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:var(--bg)}
.loginKarta{background:var(--karta);border:1px solid var(--linka);border-radius:16px;max-width:380px;width:100%;padding:32px 28px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.loginLogo{height:46px;width:auto;margin-bottom:18px;display:block}
.loginKarta h1{margin:2px 0 0;font-size:24px}
.prepnoutRezim{display:block;width:100%;margin-top:14px;font:inherit;font-size:13px;font-weight:500;background:0;border:0;color:var(--zelena-tmava);cursor:pointer;text-align:center}
.prepnoutRezim:hover{text-decoration:underline}

@media (max-width:640px){
  .telo{flex-direction:column;padding:14px}
  .rail{flex:1 1 auto;width:100%;flex-direction:row;overflow-x:auto;gap:6px}
  .railBtn{white-space:nowrap}
  .hlava{padding:14px 16px}
  .dvojice{flex-direction:column;gap:0}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
